<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#00FFFF" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#00FFFF" stop-opacity="0.04"/>
      <stop offset="1"   stop-color="#00FFFF" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- background fill -->
  <polygon points="20,0 540,0 560,20 560,220 540,240 20,240 0,220 0,20"
    fill="url(#cp-bg)"/>

  <!-- outer border stroke -->
  <polygon points="20,0 540,0 560,20 560,220 540,240 20,240 0,220 0,20"
    fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- inner thin border (inset 5px) -->
  <polygon points="24,4 536,4 556,24 556,216 536,236 24,236 4,216 4,24"
    fill="none" stroke="#00FFFF" stroke-width="0.5" stroke-opacity="0.28"/>

  <!-- top thick accent bar -->
  <line x1="20" y1="0" x2="540" y2="0" stroke="#00FFFF" stroke-width="2.5" stroke-opacity="1"/>
  <!-- bottom thick accent bar -->
  <line x1="20" y1="240" x2="540" y2="240" stroke="#00FFFF" stroke-width="2.5" stroke-opacity="1"/>

  <!-- corner accent: top-left -->
  <polyline points="0,54 0,20 20,0 72,0" fill="none" stroke="#00FFFF" stroke-width="2" stroke-opacity="1"/>
  <polyline points="0,54 0,20 20,0 72,0" fill="none" stroke="#00FFFF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- corner accent: top-right -->
  <polyline points="560,54 560,20 540,0 488,0" fill="none" stroke="#00FFFF" stroke-width="2" stroke-opacity="1"/>
  <polyline points="560,54 560,20 540,0 488,0" fill="none" stroke="#00FFFF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- corner accent: bottom-left -->
  <polyline points="0,186 0,220 20,240 72,240" fill="none" stroke="#00FFFF" stroke-width="2" stroke-opacity="1"/>
  <polyline points="0,186 0,220 20,240 72,240" fill="none" stroke="#00FFFF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- corner accent: bottom-right -->
  <polyline points="560,186 560,220 540,240 488,240" fill="none" stroke="#00FFFF" stroke-width="2" stroke-opacity="1"/>
  <polyline points="560,186 560,220 540,240 488,240" fill="none" stroke="#00FFFF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- top center deco tick -->
  <line x1="272" y1="0" x2="288" y2="0" stroke="#00FFFF" stroke-width="3" stroke-opacity="1"/>
  <!-- bottom center deco tick -->
  <line x1="272" y1="240" x2="288" y2="240" stroke="#00FFFF" stroke-width="3" stroke-opacity="1"/>

  <!-- left center tick -->
  <line x1="0" y1="112" x2="0" y2="128" stroke="#00FFFF" stroke-width="3" stroke-opacity="1"/>
  <!-- right center tick -->
  <line x1="560" y1="112" x2="560" y2="128" stroke="#00FFFF" stroke-width="3" stroke-opacity="1"/>

  <!-- top scan line (subtle) -->
  <line x1="20" y1="12" x2="540" y2="12" stroke="#00FFFF" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- bottom scan line -->
  <line x1="20" y1="228" x2="540" y2="228" stroke="#00FFFF" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- vertical divider hint (subtle, 1/3 from left for image area) -->
  <line x1="178" y1="20" x2="178" y2="220" stroke="#00FFFF" stroke-width="0.6" stroke-opacity="0.18"/>
</svg>
